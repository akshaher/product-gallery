<div class="container">
  <h1>Product Gallery</h1>

  <p>Products stored in MongoDB GridFS</p>
  <p>{{ backendHealth }}</p>

  <button (click)="syncProducts()" [disabled]="syncing">
    {{ syncing ? 'Syncing...' : 'Fetch Products from API' }}
  </button>

  <p *ngIf="loading">Loading products...</p>

  <p *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <div class="product-grid">
    <div class="product-card" *ngFor="let product of products">
      <img [src]="getImageUrl(product.imageUrl)" [alt]="product.title" />

      <div class="product-details">
        <h3>{{ product.title }}</h3>

        <p>{{ product.description }}</p>

        <span>{{ product.category }}</span>

        <h2>${{ product.price }}</h2>
      </div>
    </div>
  </div>
</div>
